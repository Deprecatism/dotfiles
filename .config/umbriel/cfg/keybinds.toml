[keybinds]
# Launchers
"Mod+Q"       = "spawn:kitty"
"Mod+R"       = "spawn:noctalia msg panel-toggle launcher"
"Mod+W"       = "spawn:helium-browser"
"Mod+E"       = "spawn:kitty yazi"
"Alt+Tab"     = "spawn:noctalia msg window-switcher"
"XF86Mail"    = "spawn:thunderbird"
"XF86Launch1" = "spawn:rog-control-centre"
# Media Controls
"XF86AudioRaiseVolume" = "spawn:amixer set Master 1%+"
"XF86AudioLowerVolume" = "spawn:amixer set Master 1%-"
"XF86AudioMute"        = "spawn:amixer set Master toggle"
"XF86AudioNext"        = "spawn:playerctl next"
"XF86AudioPrev"        = "spawn:playerctl previous"
"XF86AudioPlay"        = "spawn:playerctl play"
"XF86AudioPause"       = "spawn:playerctl pause"
# Brightness Controls
"XF86MonBrightnessUp"   = "spawn:brightnessctl set 1%+"
"XF86MonBrightnessDown" = "spawn:brightnessctl set 1%-"
# Window management
"Mod+C"               = "window-close"
"Mod+Left"            = "window-focus-left"
"Mod+Right"           = "window-focus-right"
"Mod+Up"              = "window-focus-up"
"Mod+Down"            = "window-focus-down"
"Mod+Shift+Left"      = "column-move-left"
"Mod+Shift+Right"     = "column-move-right"
"Mod+Shift+Up"        = "window-move-up"
"Mod+Shift+Down"      = "window-move-down"
"Mod+WheelDown"       = { action = "workspace-next", repeat = false }
"Mod+WheelUp"         = { action = "workspace-previous", repeat = false }
"Mod+Shift+WheelDown" = { action = "column-move-to-workspace-next", repeat = false }
"Mod+Shift+WheelUp"   = { action = "column-move-to-workspace-previous", repeat = false }
# Workspace switching
"Mod+1"       = "workspace-switch:1"
"Mod+2"       = "workspace-switch:2"
"Mod+3"       = "workspace-switch:3"
"Mod+4"       = "workspace-switch:4"
"Mod+5"       = "workspace-switch:5"
"Mod+6"       = "workspace-switch:6"
"Mod+7"       = "workspace-switch:7"
"Mod+8"       = "workspace-switch:8"
"Mod+9"       = "workspace-switch:9"
"Mod+Shift+1" = "column-move-to-workspace:1"
"Mod+Shift+2" = "column-move-to-workspace:2"
"Mod+Shift+3" = "column-move-to-workspace:3"
"Mod+Shift+4" = "column-move-to-workspace:4"
"Mod+Shift+5" = "column-move-to-workspace:5"
"Mod+Shift+6" = "column-move-to-workspace:6"
"Mod+Shift+7" = "column-move-to-workspace:7"
"Mod+Shift+8" = "column-move-to-workspace:8"
"Mod+Shift+9" = "column-move-to-workspace:9"
"Mod+Tab"     = "workspace-focus-last"
# Layout Controls
"Mod+Shift+F"   = "window-toggle-maximize"
"Mod+Shift+C"   = "column-center"
"Mod+Alt+Left"  = "window-modify-width:-0.1"
"Mod+Alt+Right" = "window-modify-width:0.1"
"Mod+Alt+Up"    = "window-modify-height:-0.1"
"Mod+Alt+Down"  = "window-modify-height:0.1"
# Modes
"Mod+V" = "window-toggle-floating"
"Mod+F" = "window-toggle-fullscreen"
# Screenshots
"Mod+Z"     = "spawn:noctalia msg screenshot-region"
"Mod+Alt+Z" = "spawn:noctalia msg screenshot-fullscreen"

# TODO: Add screenshot window functionality here... Kill me
# Overview
[hot_corners.top_left]
enabled  = true
delay_ms = 0
action   = "overview-toggle"
